name: CI

# プルリクエスト時に「ビルドが通るか」だけを確認する。デプロイは一切しない。
#
# 背景: デプロイ用ワークフロー(deploy.yml)は main への push でしか動かないため、
# これまでフロントエンドのビルド崩れは main にマージされて初めて発覚し、
# そのままデプロイまで巻き添えで失敗する状態だった。
# ここでビルドだけ先に検証しておけば、壊れた状態で main に入るのを防げる。
on:
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    name: フロントエンドのビルド
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  games-test:
    name: ゲーム(games/)のテスト
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # games/_shared と games/race は依存パッケージなしの node --test なので npm ci は不要。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test games/_shared
        working-directory: games/_shared
        run: npm test

      - name: Test games/race
        working-directory: games/race
        run: npm test

  server:
    name: Rust(server/)の検査とテスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版は server/rust-toolchain.toml で固定している。
      # 引数なしの install は、そのファイルの版と components(rustfmt・clippy)を入れる。
      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 外部のサービスは呼ばない(wiremock と trait の偽物)ので、シークレットは要らない
      - name: Test
        run: cargo test --locked

  php-lint:
    name: PHPの構文チェック
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VPS(Ubuntu 24.04)の PHP と同じ 8.3 で構文を確認する。
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint
        run: |
          find api games lib -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  cdk:
    name: AWS(CDK)の型チェック
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # aws/ は別作業(CDKスタック構築)と並行して追加されている途中のディレクトリなので、
      # まだ存在しない/package-lock.jsonが無い状態でこのジョブが動いても
      # 落ちないようにここでガードする。aws/ が揃った後は普通に型チェックが走る。
      - name: Check aws/ ディレクトリの存在確認
        id: check-aws
        run: |
          if [ -f aws/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check-aws.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aws/package-lock.json

      - name: Install dependencies
        if: steps.check-aws.outputs.exists == 'true'
        working-directory: aws
        run: npm ci

      - name: Type check
        if: steps.check-aws.outputs.exists == 'true'
        working-directory: aws
        run: npx tsc --noEmit

      - name: Test
        if: steps.check-aws.outputs.exists == 'true'
        working-directory: aws
        run: npm test

      - name: cdk synth
        if: steps.check-aws.outputs.exists == 'true'
        working-directory: aws
        run: npx cdk synth
