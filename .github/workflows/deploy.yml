name: Deploy to FTP

# main へのマージ(push)をトリガーに、フロントエンドをビルドしてFTPでアップロードする。
# 手動実行(workflow_dispatch)にも対応。
# 注: ロリポップ(エコノミープラン)のFTPSがGitHub Actionsランナーからのデータ接続で
# ECONNRESETになる問題を確認したため、暗号化なしのFTPを使用している。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        # vite.config.js の outDir 設定により、成果物はリポジトリ直下の dist/ に出力される

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          protocol: ftp
          dangerous-clean-slate: false
          # 下記はビルド成果物に含まれない/含めたくないパスに加え、
          # サーバー側にのみ存在する機密設定・実行時データ(auth.dbなど)を
          # 自動デプロイで絶対に上書き・削除しないための除外リスト。
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/frontend/**
            **/node_modules/**
            **/.DS_Store
            **/.clineignore
            **/document/**
            **/config.php
            **/config.php.example
            **/site_config.php
            **/discord_config.php
            **/api/ai_config.php
            **/api/ai_config.php.example
            **/api/lol/config.php
            **/api/lol/config.php.example
            **/generate_hash.php
            **/aws.phar
            **/lib/aws.phar
            **/db-folder/**
