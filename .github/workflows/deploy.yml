name: Deploy to FTP

# main へのマージ(push)をトリガーに、フロントエンドをビルドしてFTPでアップロードする。
# 手動実行(workflow_dispatch)にも対応。
#
# 注: ロリポップ(エコノミープラン)相手にSamKirkland/FTP-Deploy-Action(Node製の
# basic-ftpライブラリ)で接続すると、ログインは通るがデータ接続(PASV)で
# ECONNRESETになり失敗することを確認(FTP/FTPSどちらでも同様に失敗)。
# Cyberduck等の成熟したFTPクライアントでは正常に接続できていることから、
# 「サーバーが返すPASV応答のIPをそのまま信じず、賢く補正する」挙動の有無が
# 差だと考えられる。同様に枯れたCLIクライアントである lftp に切り替えている。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        # vite.config.js の outDir 設定により、成果物はリポジトリ直下の dist/ に出力される

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          lftp <<LFTP_EOF
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 20
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror --reverse --verbose --parallel=3 \
            --exclude-glob '.git*' \
            --exclude-glob '.github/' \
            --exclude-glob '.claude/' \
            --exclude-glob 'frontend/' \
            --exclude-glob 'node_modules/' \
            --exclude-glob 'document/' \
            --exclude-glob 'db-folder/' \
            --exclude-glob '.DS_Store' \
            --exclude-glob '.clineignore' \
            --exclude-glob 'config.php' \
            --exclude-glob 'config.php.example' \
            --exclude-glob 'site_config.php' \
            --exclude-glob 'discord_config.php' \
            --exclude-glob 'generate_hash.php' \
            --exclude-glob 'aws.phar' \
            --exclude-glob 'api/ai_config.php' \
            --exclude-glob 'api/ai_config.php.example' \
            --exclude-glob 'api/lol/config.php' \
            --exclude-glob 'api/lol/config.php.example' \
            --exclude-glob 'lib/aws.phar' \
            ./ "$FTP_SERVER_DIR"
          bye
          LFTP_EOF
        # mirror --reverse はデフォルトで「差分アップロードのみ」、--delete を付けない限り
        # サーバー側にしかないファイル(config.php・auth.dbなど)を削除しないので安全。
