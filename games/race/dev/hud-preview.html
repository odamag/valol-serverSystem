<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MG01 Race - HUD プレビュー</title>
<link rel="stylesheet" href="../style.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #274a2f 0%, #1c3620 60%, #16281a 100%);
  }
  #info {
    position: fixed; left: 8px; bottom: 8px; z-index: 20;
    font: 12px/1.5 sans-serif; color: #fff; background: rgba(0,0,0,0.55);
    padding: 6px 10px; border-radius: 6px; pointer-events: none;
    white-space: pre;
  }
  #pollInfo {
    position: fixed; right: 8px; bottom: 8px; z-index: 20;
    font: 12px/1.6 monospace; color: #baffc9; background: rgba(0,0,0,0.6);
    padding: 8px 12px; border-radius: 6px; pointer-events: none;
    white-space: pre;
    min-width: 220px;
  }
</style>
</head>
<body>
<!-- ロジックなしで HUD だけを確かめるページ(設計書 13節、実装プラン T12)。ゲーム本体(RaceHost/RaceClient)は
     使わず、偽の RenderView を毎フレーム作って createHud().update() に渡す。キーで各表示を切り替えられる。 -->
<div id="hud"></div>
<div id="info">MG01 Race HUD プレビュー
1: WRONG WAY 切替   2: アイテムのルーレットを開始
3: BOOST! 切替      4: SPIN! 切替
5: 自分のFINISH切替  6: grace(残り秒数)切替
7: カウントダウンを開始(3→GO!)
8: 7番プレイヤーをDNF切替
入力(W/S/A/D、矢印、Space、C、左クリック、ゲームパッド)は右下に表示</div>
<div id="pollInfo"></div>

<script type="module" src="./hud-preview.js"></script>
</body>
</html>
