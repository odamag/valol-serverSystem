<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイテムレース (MG01) - P2P対戦</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="game"></canvas>
<div id="hud"></div>
<div id="lobby"></div>

<script type="module">
  // standalone.js と game.js は後のタスク(T12 など)で作るので、T0 の時点では動かなくてよい。
  import { startStandalone } from '../_shared/standalone/standalone.js';
  import { definition } from './src/game.js';

  const params = new URLSearchParams(location.search);
  startStandalone(definition, {
    controlsHelp: 'W/S/A/D:走行  Space:アイテム  S+Space:逆向きに投げる  C/X:後ろを見る(押している間。この間に使うと逆向きに投げる)',
    parseSettings(urlParams) {
      // 設計書 11節。settings は makeConfig(overrides) にそのまま渡る深いマージの形にする
      // (test の中身は forceItemBySlot も含めて1つのオブジェクトにまとめる)。
      // autopilot / view / latency は game.js だけが読み、makeConfig には渡さない
      // (RaceConfig.autopilot などと名前がぶつかるため。設計書 11節、game.js のコメント参照)。
      const settings = {};
      if (urlParams.has('laps')) settings.laps = Number(urlParams.get('laps'));
      if (urlParams.has('finishRule')) settings.finishRule = urlParams.get('finishRule');
      if (urlParams.has('autopilot')) settings.autopilot = urlParams.get('autopilot') === '1';
      if (urlParams.has('view')) settings.view = Number(urlParams.get('view'));
      if (urlParams.has('latency')) settings.latency = Number(urlParams.get('latency'));

      const test = {};
      let hasTest = false;
      if (urlParams.has('testEffects')) {
        test.effects = urlParams.get('testEffects') === '1';
        hasTest = true;
      }
      if (urlParams.has('forceItem')) {
        test.forceItem = urlParams.get('forceItem');
        hasTest = true;
      }
      const forceItemBySlot = {};
      let hasForceItemBySlot = false;
      for (let slot = 0; slot < 8; slot++) {
        const key = `forceItem${slot}`;
        if (urlParams.has(key)) {
          forceItemBySlot[slot] = urlParams.get(key);
          hasForceItemBySlot = true;
        }
      }
      if (hasForceItemBySlot) {
        test.forceItemBySlot = forceItemBySlot;
        hasTest = true;
      }
      if (hasTest) settings.test = test;

      return settings;
    },
  }, params);
</script>
</body>
</html>
